# Builds the Windows .exe and the macOS .app on GitHub's machines.
# - "Run workflow" on the Actions tab: test build, files under the run's Artifacts.
# - Push a tag like v0.2.0: also publishes a GitHub Release with both files.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover tests
      - run: pip install pyinstaller==6.11.1
      - run: pyinstaller --noconfirm --onefile --windowed --name LightroomRecover --distpath dist --workpath build --specpath build lrrecover_gui.py
      - uses: actions/upload-artifact@v6
        with:
          name: LightroomRecover-windows
          path: dist/LightroomRecover.exe

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon
            chip: AppleSilicon
            arch: arm64
          - runner: macos-15-intel     # Intel
            chip: Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: chmod +x build_mac.sh && PYTHON=python ./build_mac.sh
      - name: Check the app is built for ${{ matrix.arch }}
        run: |
          archs=$(lipo -archs "dist/Lightroom Recover.app/Contents/MacOS/Lightroom Recover")
          echo "app architecture: $archs"
          [[ " $archs " == *" ${{ matrix.arch }} "* ]]
      - uses: actions/upload-artifact@v6
        with:
          name: LightroomRecover-mac-${{ matrix.chip }}
          path: dist/LightroomRecover-mac-${{ matrix.chip }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: files
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            files/LightroomRecover.exe \
            files/LightroomRecover-mac-AppleSilicon.zip \
            files/LightroomRecover-mac-Intel.zip \
            --repo "$GITHUB_REPOSITORY" --title "Lightroom Recover $GITHUB_REF_NAME" \
            --notes "**Windows:** download \`LightroomRecover.exe\` and double-click it.

          **Mac:** open the Apple menu → About This Mac. If it says *Chip: Apple M…*, download \`LightroomRecover-mac-AppleSilicon.zip\`. If it says *Processor: Intel*, download \`LightroomRecover-mac-Intel.zip\`. Unzip and open *Lightroom Recover*.

          Step-by-step instructions are in the README."
